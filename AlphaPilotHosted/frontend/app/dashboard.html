<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AlphaPilot — Dashboard</title>
  <style>
    body{margin:0;background:#0b0f1a;color:#eaf1ff;font-family:Inter,system-ui,Arial}
    .wrap{max-width:900px;margin:0 auto;padding:20px}
    .card{background:#0f1625;border:1px solid #1f2b44;border-radius:14px;padding:16px}
    input,button{border-radius:10px;border:1px solid #1f2b44;padding:8px 10px;background:#0b1220;color:#eaf1ff}
    button{background:#4da3ff;border:0;color:#001;cursor:pointer}
    pre{background:#111827;padding:10px;border-radius:10px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Dashboard</h1>
    <div class="card">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button id="btnHealth">Check /api/health</button>
        <button id="btnPortfolio">Get Portfolio</button>
        <input id="sym" placeholder="AAPL" value="AAPL"/>
        <button id="btnSignal">Get Signal</button>
      </div>
      <pre id="out" style="margin-top:12px"></pre>
    </div>
  </div>
  <script>
    const out = document.getElementById('out');
    async function call(path){
      out.textContent='Loading '+path+' ...';
      const r = await fetch(path, { headers: { 'X-API-KEY': (localStorage.getItem('API_TOKEN')||'') }});
      const t = await r.text();
      out.textContent = t;
    }
    document.getElementById('btnHealth').onclick = () => call('/health');
    document.getElementById('btnPortfolio').onclick = () => call('/api/portfolio');
    document.getElementById('btnSignal').onclick = () => {
      const s = document.getElementById('sym').value || 'AAPL';
      call('/api/signal?symbol='+encodeURIComponent(s));
    }
  </script>
</body>
</html>
