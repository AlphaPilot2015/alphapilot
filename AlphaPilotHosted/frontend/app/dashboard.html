<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AlphaPilot — Dashboard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <style>
    body{margin:0;font:14px/1.5 system-ui,Arial;background:#0b0f1a;color:#eaf1ff}
    .wrap{max-width:960px;margin:0 auto;padding:24px}
    .card{background:#0f1625;border:1px solid #1f2b44;border-radius:14px;padding:16px}
    a.btn,button{display:inline-block;background:#4da3ff;color:#001;text-decoration:none;
      padding:10px 14px;border-radius:10px;border:0;cursor:pointer}
    pre{white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AlphaPilot — Dashboard</h1>
    <div class="card">
      <p>Estado API: <span id="status">…</span></p>
      <p><button id="run">Probar /api/demo</button></p>
      <pre id="out"></pre>
    </div>
  </div>
  <script>
    (async () => {
      try{
        const r = await fetch('/api/health');
        document.getElementById('status').textContent = r.ok ? 'ONLINE' : 'OFFLINE';
      }catch{ document.getElementById('status').textContent = 'OFFLINE'; }
    })();
    document.getElementById('run').onclick = async () => {
      const out = document.getElementById('out');
      out.textContent = 'Ejecutando…';
      try{
        const r = await fetch('/api/demo',{headers:{'Accept':'application/json'}});
        out.textContent = JSON.stringify(await r.json(), null, 2);
      }catch(e){ out.textContent = 'Error: '+e; }
    };
  </script>
</body>
</html>
